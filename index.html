<!doctype html>
<html lang="ru" data-palette="violet">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chroniqe — гибкие списки для фильмов, игр, покупок и любых идей."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Chroniqe</title>
    <script>
      try {
        var t = localStorage.getItem('chroniqe-theme')
        var dark =
          t === 'dark' ||
          (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var palettes = ['violet', 'ocean', 'forest', 'rose', 'amber', 'slate']
        var p = localStorage.getItem('chroniqe-palette')
        document.documentElement.setAttribute(
          'data-palette',
          palettes.indexOf(p) >= 0 ? p : 'violet',
        )
        var langs = ['ru', 'en', 'pl', 'es', 'zh', 'de', 'fr', 'uk', 'be', 'it']
        var lang = localStorage.getItem('chroniqe-lang')
        if (langs.indexOf(lang) >= 0) {
          document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
